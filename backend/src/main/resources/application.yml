server:
  port: 8080

spring:
  application:
    name: cat-shop-backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, Hibernate only validates
    open-in-view: false
    properties:
      hibernate:
        use_nationalized_character_data: true
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  auth:
    login-limit: 10
    login-window-ms: 60000
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    cleanup:
      enabled: ${APP_AUTH_CLEANUP_ENABLED:true}
      batch-size: ${APP_AUTH_CLEANUP_BATCH_SIZE:200}
      max-batches: ${APP_AUTH_CLEANUP_MAX_BATCHES:10}
      delay-ms: ${APP_AUTH_CLEANUP_DELAY_MS:3600000}
      initial-delay-ms: ${APP_AUTH_CLEANUP_INITIAL_DELAY_MS:60000}
  jwt:
    # Required in every runtime environment; never publish a reusable signing key.
    secret: ${APP_JWT_SECRET}
    expiration-ms: 900000          # 15 minutes; refresh session has an absolute 7-day lifetime
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: info
