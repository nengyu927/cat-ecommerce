# Production-like SQL Server profile. Required secrets deliberately have no fallback.
spring:
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:catshop};encrypt=true;trustServerCertificate=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: false
app:
  auth:
    cookie-secure: true
  jwt:
    secret: ${APP_JWT_SECRET}
logging:
  level:
    org.hibernate.SQL: warn
